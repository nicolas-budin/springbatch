# Ne pas lancer helloJob automatiquement au démarrage de l'application
# (JobLauncherCommandLineRunner) : c'est le scheduler (HelloJobScheduler) qui le lance.
spring.batch.job.enabled=false

# Fréquence de lancement du job : toutes les 5 minutes (à 12:00, 12:05, 12:10...).
# Format cron Spring, 6 champs : seconde minute heure jour-du-mois mois jour-de-la-semaine
hello.scheduler.cron=0 */5 * * * *

# Afficher dans les logs les requêtes SQL que Spring Batch exécute sur ses tables BATCH_*
# (création de la JobInstance, mise à jour des compteurs après chaque chunk, statut final...).
# Spring Batch passe par le JdbcTemplate de Spring : il suffit de mettre ce composant en DEBUG.
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
# Pour voir aussi la valeur de chaque paramètre "?" (STARTED, COMPLETED, compteurs...),
# décommenter la ligne suivante. Très bavard : une ligne par paramètre, ~20 par UPDATE.
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
